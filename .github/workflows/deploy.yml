name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows a manual deploy from the Actions tab, e.g. after changing the Pages settings.
  workflow_dispatch:

# Permissions required by the official GitHub Pages actions.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. We do not cancel a running one - a deployment
# stopped halfway would leave the site in an inconsistent state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          # The site runs on a custom domain (public/CNAME), so it is served
          # from the root - basePath has to stay empty. If the domain were
          # ever removed, /<repo-name> would have to go here.
          NEXT_PUBLIC_BASE_PATH: ''
          NEXT_PUBLIC_SITE_URL: https://bodykit.dawidolko.pl
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

      - name: Add .nojekyll
        # Without this file GitHub Pages runs the directory through Jekyll,
        # which skips directories starting with an underscore - and that is
        # exactly where Next.js keeps all of _next/static.
        run: touch out/.nojekyll

      - name: Verify CNAME
        # The CNAME file from public/ has to end up in the build output,
        # otherwise GitHub Pages loses the custom-domain setting on every
        # deployment.
        run: |
          test -f out/CNAME || { echo "Missing out/CNAME"; exit 1; }
          echo "Domain: $(cat out/CNAME)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
