name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Pozwala wdrozyc recznie z zakladki Actions, np. po zmianie ustawien Pages.
  workflow_dispatch:

# Uprawnienia wymagane przez oficjalne akcje GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Jedno wdrozenie naraz. Nie przerywamy trwajacego - wdrozenie w polowie
# drogi zostawiloby serwis w niespojnym stanie.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          # Serwis dziala pod wlasna domena (public/CNAME), wiec jest
          # serwowany z korzenia - basePath musi pozostac pusty. Gdyby
          # domena zostala kiedys usunieta, trzeba tu wpisac /<nazwa-repo>.
          NEXT_PUBLIC_BASE_PATH: ''
          NEXT_PUBLIC_SITE_URL: https://bodykit.dawidolko.pl
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

      - name: Add .nojekyll
        # Bez tego pliku GitHub Pages przepuszcza katalog przez Jekylla,
        # ktory pomija katalogi zaczynajace sie od podkreslenia - a tam
        # Next.js trzyma cale _next/static.
        run: touch out/.nojekyll

      - name: Verify CNAME
        # Plik CNAME z public/ musi trafic do wyniku budowania, inaczej
        # GitHub Pages przy kazdym wdrozeniu gubi ustawienie domeny.
        run: |
          test -f out/CNAME || { echo "Brak out/CNAME"; exit 1; }
          echo "Domena: $(cat out/CNAME)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
