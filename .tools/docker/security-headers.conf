# =============================================================================
# Security headers included in EVERY location block.
#
# nginx inherits add_header only when the child block defines none of its own.
# A single add_header inside a location is enough to make every header from
# the server level disappear - which is why we keep them in a separate file
# and include it explicitly wherever they are needed.
# =============================================================================

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

# The application is fully static and loads nothing from the outside.
# 'unsafe-inline' for styles and scripts is required by Next.js: the style
# attributes emitted for image placeholders, plus the inline script that sets
# the theme before the first paint.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
