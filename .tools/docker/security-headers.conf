# =============================================================================
# Naglowki bezpieczenstwa dolaczane do KAZDEGO bloku location.
#
# nginx dziedziczy add_header tylko wtedy, gdy blok potomny nie definiuje
# zadnego wlasnego. Wystarczy jeden add_header w location, zeby wszystkie
# naglowki z poziomu server zniknely - dlatego trzymamy je w osobnym pliku
# i dolaczamy jawnie tam, gdzie sa potrzebne.
# =============================================================================

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

# Aplikacja jest w pelni statyczna i nie laduje niczego z zewnatrz.
# 'unsafe-inline' dla stylow i skryptow jest wymagany przez Next.js:
# atrybuty style przy placeholderach obrazow oraz inline'owy skrypt
# ustawiajacy motyw przed pierwszym malowaniem.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
