# =============================================================================
# Konfiguracja nginx dla statycznego eksportu BodyKit Shop.
#
# Aplikacja jest budowana z trailingSlash: true, wiec kazda podstrona to
# katalog z plikiem index.html. Dlatego wystarczy zwykle $uri/ zamiast
# przepisywania wszystkiego na jeden plik jak w klasycznym SPA.
#
# Uwaga o naglowkach: nginx dziedziczy add_header tylko do blokow, ktore
# nie definiuja zadnego wlasnego. Dlatego naglowki bezpieczenstwa siedza
# w security-headers.conf i sa dolaczane w kazdym location osobno.
# =============================================================================

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nie ujawniaj wersji serwera w naglowkach i na stronach bledow.
    server_tokens off;

    # ---- Kompresja ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff2;
    # Obrazy AVIF/WebP sa juz skompresowane - ponowna kompresja tylko
    # zjadalaby procesor bez zysku na rozmiarze.

    # ---- Zasoby z odciskiem palca w nazwie: cache na rok ----
    location /_next/static/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # ---- Obrazy i fonty ----
    location ~* \.(avif|webp|jpg|jpeg|png|gif|ico|svg|woff2?)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    # ---- Dokumenty HTML: zawsze weryfikuj aktualnosc ----
    location ~* \.html$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # ---- Trasy ----
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        # Katalog z index.html jest wynikiem trailingSlash: true, wiec
        # sprawdzamy go przed wariantem z rozszerzeniem .html.
        try_files $uri $uri/ $uri.html =404;
        # Strony HTML nie powinny byc cache'owane na stale - inaczej
        # po wdrozeniu uzytkownik ogladalby stara wersje.
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/snippets/security-headers.conf;
        internal;
    }

    # Ukryj pliki zaczynajace sie od kropki (np. .git, .env), gdyby
    # przypadkiem trafily do katalogu publicznego.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
