# =============================================================================
# nginx configuration for the BodyKit Shop static export.
#
# The application is built with trailingSlash: true, so every subpage is a
# directory holding an index.html file. That is why a plain $uri/ is enough
# instead of rewriting everything onto a single file like in a classic SPA.
#
# A note about headers: nginx inherits add_header only into blocks that define
# none of their own. That is why the security headers live in
# security-headers.conf and are included separately in every location.
# =============================================================================

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not reveal the server version in headers or on error pages.
    server_tokens off;

    # ---- Compression ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff2;
    # AVIF/WebP images are already compressed - compressing them again would
    # only burn CPU without any gain in size.

    # ---- Fingerprinted assets: cache for a year ----
    location /_next/static/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # ---- Images and fonts ----
    location ~* \.(avif|webp|jpg|jpeg|png|gif|ico|svg|woff2?)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    # ---- HTML documents: always revalidate ----
    location ~* \.html$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # ---- Routes ----
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        # A directory holding an index.html is what trailingSlash: true
        # produces, so we try it before the variant with the .html extension.
        try_files $uri $uri/ $uri.html =404;
        # HTML pages must not be cached permanently - otherwise a user would
        # keep seeing the old version after a deployment.
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/snippets/security-headers.conf;
        internal;
    }

    # Hide dot-files (e.g. .git, .env) in case they ever end up in the public
    # directory by accident.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
